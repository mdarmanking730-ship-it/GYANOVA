<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GYANOVA Owner Panel</title><style>body{margin:0;font-family:Arial;background:#07111f;color:#fff}.wrap{max-width:900px;margin:auto;padding:24px}.box{background:#0d1e31;border:1px solid #1b4c70;padding:20px;border-radius:18px;margin:16px 0}input,textarea{width:100%;padding:12px;margin:7px 0 12px;background:#081522;color:#fff;border:1px solid #315878;border-radius:9px}button{background:#1599ed;color:#fff;border:0;border-radius:9px;padding:11px 16px;margin:5px}.danger{background:#d6444d}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:15px;background:#10283e;border-radius:12px;min-width:120px}</style><div class=wrap><h1>GYANOVA Owner Panel 🔐</h1><div class=box id=login><input id=e placeholder="Owner Email"><input id=p type=password placeholder="Password"><button onclick=login()>Login</button></div><div id=app style=display:none><div class=box><h2>📊 Dashboard</h2><div id=s class=stats></div></div><div class=box><h2>🎬 Add Video</h2><input id=vt placeholder="Title"><input id=vc placeholder="Category"><input id=vu placeholder="YouTube URL"><textarea id=vd placeholder="Description"></textarea><button onclick=addVideo()>Save Video</button></div><div class=box><h2>📢 Add Announcement</h2><input id=at placeholder="Title"><textarea id=ab placeholder="Announcement"></textarea><button onclick=addAnn()>Publish</button></div><div class=box><h2>📝 Add Practice Test</h2><input id=tt placeholder="Test title"><input id=ts placeholder="Subject"><button onclick=addTest()>Create Test</button></div><div class=box><h2>Current Videos</h2><div id=list></div></div></div></div><script>const API="http://localhost:8080";let token="";async function req(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};return fetch(API+path,opt)}async function login(){let r=await fetch(API+"/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e.value,password:p.value})}),d=await r.json();if(!r.ok)return alert(d.error);token=d.token;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load()}async function load(){let st=await(await req('/api/admin/stats')).json();s.innerHTML=Object.entries(st).map(([k,v])=>`<div class=stat><b>${v}</b><br>${k}</div>`).join('');let v=await(await fetch(API+'/api/videos')).json();list.innerHTML=v.map(x=>`<div><b>${x.title}</b> — ${x.category} <button class=danger onclick="del(${x.id})">Delete</button></div>`).join('')}async function addVideo(){let r=await req('/api/admin/videos',{method:'POST',body:JSON.stringify({title:vt.value,category:vc.value,url:vu.value,description:vd.value})}),d=await r.json();if(!r.ok)return alert(d.error);[vt,vc,vu,vd].forEach(x=>x.value='');load()}async function del(id){await req('/api/admin/videos/'+id,{method:'DELETE'});load()}async function addAnn(){let r=await req('/api/admin/announcements',{method:'POST',body:JSON.stringify({title:at.value,body:ab.value})}),d=await r.json();if(!r.ok)return alert(d.error);at.value=ab.value='';alert('Published')}async function addTest(){let r=await req('/api/admin/tests',{method:'POST',body:JSON.stringify({title:tt.value,subject:ts.value,questions:[]})}),d=await r.json();if(!r.ok)return alert(d.error);tt.value=ts.value='';alert('Test created')}</script>
